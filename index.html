        // CSVのパース処理
        function parseCsv(csvText) {
            const lines = csvText.trim().split('\n');
            const result = [];
            // 1行目はヘッダーなのでスキップ
            for (let i = 1; i < lines.length; i++) {
                const line = lines[i];
                if (!line) continue;
                
                let inQuotes = false;
                let currentField = '';
                const fields = [];
                
                for (let j = 0; j < line.length; j++) {
                    const char = line[j];
                    if (char === '"') {
                        inQuotes = !inQuotes;
                    } else if (char === ',' && !inQuotes) {
                        fields.push(currentField);
                        currentField = '';
                    } else {
                        currentField += char;
                    }
                }
                fields.push(currentField);
                
                if (fields.length >= 3) {
                    result.push({
                        word: fields[0].trim(),
                        meaning: fields[1].trim(),
                        example: fields[2].trim()
                    });
                }
            }
            return result;
        }

        // 定着率の計算 (出題されたうち正解した割合の平均)
        function calculateMastery(wordList) {
            if (wordList.length === 0) return 0;
            let totalScore = 0;
            wordList.forEach(w => {
                const stat = history[w.word];
                if (stat && stat.total > 0) {
                    totalScore += (stat.correct / stat.total);
                }
            });
            // 最大100%
            return Math.round((totalScore / wordList.length) * 100);
        }

        // プログレスバーのHTML生成
        function createProgressBar(percent) {
            let color = 'bg-blue-600';
            if (percent < 30) color = 'bg-red-500';
            else if (percent > 80) color = 'bg-green-500';
            
            return `
                <div class="flex justify-between items-center mb-1">
                    <span class="text-xs font-semibold text-slate-500">定着率</span>
                    <span class="text-xs font-bold text-slate-700">${percent}%</span>
                </div>
                <div class="w-full bg-slate-200 rounded-full h-2.5 overflow-hidden">
                    <div class="${color} h-2.5 rounded-full transition-all duration-700 ease-out" style="width: ${percent}%"></div>
                </div>
            `;
        }

        // 配列のシャッフル
        function shuffleArray(array) {
            const arr = [...array];
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

                const mastery = calculateMastery(sec.words);
                html += `
                    <div class="mb-6 p-4 border border-slate-100 rounded-xl bg-slate-50/50 hover:bg-slate-50 transition">
                        <div class="mb-3">
                            <h3 class="font-bold text-slate-700">${sec.name}</h3>
                            <div class="mt-2 max-w-xs">
                                ${createProgressBar(mastery)}
                            </div>
                        </div>
                        ${createQuizButtons(index, sec.words.length)}
                    </div>
                `;
            });

            // 全範囲の描画
            html += `
                <div class="mt-8 mb-6 p-4 border border-indigo-100 rounded-xl bg-indigo-50/30 hover:bg-indigo-50/50 transition">
                    <div class="mb-3">
                        <h3 class="font-bold text-indigo-900">全範囲からランダム出題 (${words.length}単語)</h3>
                    </div>
                    ${createQuizButtons(-1, words.length)}
                </div>
            </div>
            `;

            appContainer.innerHTML = html;
        }

        function createQuizButtons(sectionIndex, maxWords) {
            const counts = [10, 20, 50];
            let buttonsHtml = '<div class="flex flex-wrap gap-2 mt-3">';
            
            counts.forEach(c => {
                const displayCount = Math.min(c, maxWords);
                // 既に表示済みの数と同じ場合はスキップ (例: 最大40問で、20問の次に50問(40問扱い)を出さないための工夫)
                // 今回はシンプルに、上限を超えるボタンは上限値にして表示するが、重複は省く。
                
                if (c <= maxWords || (c === 50 && maxWords > 20)) {
                    buttonsHtml += `<button onclick="startQuiz(${sectionIndex}, ${displayCount})" class="px-5 py-2 bg-white border border-slate-300 text-slate-700 font-medium rounded-lg hover:bg-blue-50 hover:text-blue-600 hover:border-blue-300 transition shadow-sm text-sm active:scale-95">
                        ${displayCount}問
                    </button>`;
                }
            });
            
            buttonsHtml += '</div>';
            return buttonsHtml;
        }

        function startQuiz(sectionIndex, count) {
            let sourceWords = [];
            if (sectionIndex === -1) {
                sourceWords = [...words];
            } else {
                sourceWords = [...sections[sectionIndex].words];
            }

            // 出題単語をシャッフルして必要な数だけ抽出
            sourceWords = shuffleArray(sourceWords).slice(0, count);

            // クイズ問題の構築
            const questions = sourceWords.map(targetWord => {
                // 正解以外の意味を全単語からランダムに3つ選ぶ
                const otherMeanings = words
                    .filter(w => w.word !== targetWord.word)
                    .map(w => w.meaning);
                
                const shuffledOthers = shuffleArray(otherMeanings).slice(0, 3);
                
                // 選択肢を構成してシャッフル
                const options = shuffleArray([targetWord.meaning, ...shuffledOthers]);
                
                return {
                    word: targetWord.word,
                    meaning: targetWord.meaning, // 正解
                    example: targetWord.example,
                    options: options
                };
            });

            quizState = {
                questions: questions,
                currentIndex: 0,
                answers: [],
                isAnswered: false
            };

            renderQuiz();
        }

        function renderQuiz() {
            const q = quizState.questions[quizState.currentIndex];
            const progress = ((quizState.currentIndex) / quizState.questions.length) * 100;
            
            let html = `
                <div class="fade-in bg-white rounded-2xl shadow-sm border border-slate-200 p-6 md:p-10 max-w-2xl mx-auto">
                    <!-- ヘッダー (プログレス) -->
                    <div class="flex justify-between items-center mb-2">
                        <button onclick="if(confirm('クイズを中断してホームに戻りますか？')) renderHome()" class="text-sm text-slate-400 hover:text-slate-600 flex items-center gap-1">
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
                            やめる
                        </button>
                        <span class="text-sm font-bold text-slate-500">問題 ${quizState.currentIndex + 1} / ${quizState.questions.length}</span>
                    </div>
                    <div class="w-full bg-slate-100 rounded-full h-1.5 mb-8">
                        <div class="bg-blue-500 h-1.5 rounded-full transition-all duration-300" style="width: ${progress}%"></div>
                    </div>

                    <!-- 問題 -->
                    <div class="text-center mb-8">
                        <h2 class="text-4xl md:text-5xl font-black text-slate-800 tracking-tight">${q.word}</h2>
                    </div>

                    <!-- 選択肢 -->
                    <div class="space-y-3" id="options-container">
            `;

            q.options.forEach((opt, idx) => {
                html += `
                    <button onclick="handleAnswer('${opt.replace(/'/g, "\\'")}', this)" class="option-btn w-full text-left p-4 rounded-xl border-2 border-slate-200 bg-white hover:border-blue-300 hover:bg-blue-50 text-slate-700 font-medium transition-all duration-200">
                        ${opt}
                    </button>
                `;
            });

            html += `
                    </div>
                    
                    <!-- 結果と解説 (初期は非表示) -->
                    <div id="explanation" class="hidden mt-6 p-5 rounded-xl border">
                        <div id="result-badge" class="inline-block px-3 py-1 rounded-full text-sm font-bold mb-3"></div>
                        <p class="text-sm text-slate-500 mb-1">意味:</p>
                        <p class="text-lg font-bold text-slate-800 mb-4">${q.meaning}</p>
                        <p class="text-sm text-slate-500 mb-1">用法・例文:</p>
                        <p class="text-md text-slate-700 italic">${q.example || 'なし'}</p>
                        
                        <button onclick="nextQuestion()" class="mt-6 w-full py-3 bg-blue-600 text-white font-bold rounded-xl hover:bg-blue-700 transition shadow-md active:scale-95">
                            ${quizState.currentIndex === quizState.questions.length - 1 ? '結果を見る' : '次の問題へ'}
                        </button>
                    </div>
                </div>
            `;

            appContainer.innerHTML = html;
        }

        // 回答処理 (グローバル関数として露出)
        window.handleAnswer = function(selectedOption, btnElement) {
            if (quizState.isAnswered) return;
            quizState.isAnswered = true;

            const q = quizState.questions[quizState.currentIndex];
            const isCorrect = selectedOption === q.meaning;

            // 履歴の更新
            if (!history[q.word]) {
                history[q.word] = { correct: 0, total: 0 };
            }
            history[q.word].total += 1;
            if (isCorrect) {
                history[q.word].correct += 1;
            }
            localStorage.setItem('quizHistory', JSON.stringify(history));

            // 回答記録の保存
            quizState.answers.push({
                word: q.word,
                isCorrect: isCorrect,
                selected: selectedOption,
                correct: q.meaning,
                example: q.example
            });

            // UIの更新
            const buttons = document.querySelectorAll('.option-btn');
            buttons.forEach(btn => {
                btn.disabled = true;
                btn.classList.remove('hover:border-blue-300', 'hover:bg-blue-50', 'cursor-pointer');
                
                if (btn.innerText.trim() === q.meaning) {
                    // 正解のボタン
                    btn.classList.add('bg-green-50', 'border-green-500', 'text-green-800');
                    if (isCorrect) {
                        btn.innerHTML += ' <span class="float-right font-bold">⭕️</span>';
                    } else {
                         btn.innerHTML += ' <span class="float-right font-bold text-green-600">正解</span>';
                    }
                } else if (btn === btnElement && !isCorrect) {
                    // 間違えて選んだボタン
                    btn.classList.add('bg-red-50', 'border-red-500', 'text-red-800', 'opacity-70');
                    btn.innerHTML += ' <span class="float-right font-bold">❌</span>';
                } else {
                    // その他のボタン
                    btn.classList.add('opacity-40');
                }
            });

            // 解説エリアの表示
            const explanation = document.getElementById('explanation');
            const resultBadge = document.getElementById('result-badge');
            
            explanation.classList.remove('hidden');
            if (isCorrect) {
                explanation.classList.add('bg-green-50/50', 'border-green-200');
                resultBadge.classList.add('bg-green-100', 'text-green-700');
                resultBadge.innerText = '⭕️ 正解！';
            } else {
                explanation.classList.add('bg-red-50/50', 'border-red-200');
                resultBadge.classList.add('bg-red-100', 'text-red-700');
                resultBadge.innerText = '❌ 不正解...';
            }
        };

        window.nextQuestion = function() {
            quizState.currentIndex++;
            if (quizState.currentIndex < quizState.questions.length) {
                quizState.isAnswered = false;
                renderQuiz();
            } else {
                renderResult();
            }
        };

        function renderResult() {
            const totalQuestions = quizState.answers.length;
            const correctCount = quizState.answers.filter(a => a.isCorrect).length;
            const scorePercent = Math.round((correctCount / totalQuestions) * 100);

            let message = '素晴らしい！';
            if (scorePercent < 50) message = 'もう少し頑張りましょう！';
            else if (scorePercent < 80) message = 'よくできました！';
            else if (scorePercent === 100) message = 'パーフェクト！！';

            let html = `
                <div class="fade-in bg-white rounded-2xl shadow-sm border border-slate-200 p-6 md:p-10 max-w-3xl mx-auto">
                    <div class="text-center mb-8">
                        <h2 class="text-2xl font-bold text-slate-800 mb-2">クイズ結果</h2>
                        <div class="inline-block bg-blue-50 text-blue-800 text-5xl font-black py-4 px-8 rounded-2xl mb-4 shadow-sm border border-blue-100">
                            ${correctCount} / ${totalQuestions}
                        </div>
                        <p class="text-lg font-bold text-slate-600">${message}</p>
                    </div>

                    <div class="flex justify-center mb-8">
                        <button onclick="renderHome()" class="px-8 py-3 bg-slate-800 text-white font-bold rounded-xl hover:bg-slate-700 transition shadow-md active:scale-95">
                            ホームに戻る
                        </button>
                    </div>

                    <h3 class="text-xl font-bold text-slate-800 mb-4 border-b pb-2">正誤一覧</h3>
                    <div class="space-y-4">
            `;

            quizState.answers.forEach((ans, idx) => {
                const isCorrect = ans.isCorrect;
                const bgColor = isCorrect ? 'bg-green-50' : 'bg-red-50';
                const borderColor = isCorrect ? 'border-green-200' : 'border-red-200';
                const icon = isCorrect ? '⭕️' : '❌';

                html += `
                    <div class="p-4 rounded-xl border ${borderColor} ${bgColor}">
                        <div class="flex items-start gap-3">
                            <div class="mt-1 flex-shrink-0">${icon}</div>
                            <div class="flex-grow">
                                <div class="flex items-baseline gap-2 mb-1">
                                    <span class="text-xl font-bold text-slate-800">${ans.word}</span>
                                </div>
                                <p class="text-sm font-bold text-slate-700 mb-1">正解: ${ans.correct}</p>
                                ${!isCorrect ? `<p class="text-sm text-slate-500 mb-1 line-through">あなたの回答: ${ans.selected}</p>` : ''}
                                <p class="text-xs text-slate-600 mt-2 p-2 bg-white/60 rounded border border-white">${ans.example || ''}</p>
                            </div>
                        </div>
                    </div>
                `;
            });

            html += `
                    </div>
                    
                    <div class="mt-8 text-center">
                        <button onclick="renderHome()" class="px-8 py-3 bg-slate-200 text-slate-800 font-bold rounded-xl hover:bg-slate-300 transition active:scale-95">
                            ホームに戻る
                        </button>
                    </div>
                </div>
            `;

            appContainer.innerHTML = html;
            // ページトップへスクロール
            window.scrollTo(0, 0);
        }

        // アプリケーションの初期化
        renderHome();
    </script>
</body>
</html>
